name: Nexauren Hub — Validate, Build and Check SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate:catalog
      - run: npm run build
        env:
          SITE_URL: https://nexauren-hub.pages.dev
